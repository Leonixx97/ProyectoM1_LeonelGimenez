<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./styles.css">
  <title>Generador de Paletas</title>

  <style>
    
  </style>
</head>

<body>

  <main>

    <header>
      <h1>Generador de Paletas</h1>
      <p>Genera paletas aleatorias en formato HEX o HSL</p>
    </header>

    <section
      class="controls"
      aria-label="Controles de generación"
    >

      <div class="field">
        <label for="paletteSize">Cantidad de colores</label>

        <select id="paletteSize">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>
      </div>

      <div class="field">
        <label for="colorFormat">Formato</label>

        <select id="colorFormat">
          <option value="hex">HEX</option>
          <option value="hsl">HSL</option>
        </select>
      </div>

      <button id="generateBtn">
        Generar paleta
      </button>

    </section>

    <section
      class="palette"
      id="palette"
      aria-live="polite"
    ></section>

  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="assertive"
  ></div>
  
  <script src="script.js"></script>

</body>
</html>
